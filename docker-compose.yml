services:
  postgres:
    image: postgres:16
    container_name: flight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flightradar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: flight-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: container'lar arası (producer/consumer/ws_server -> kafka:29092)
      # PLAINTEXT: host makineden erişim (örn. localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  producer:
    build: .
    container_name: flight-producer
    restart: unless-stopped
    command: ["python", "producer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  consumer-db:
    build: .
    container_name: flight-consumer-db
    restart: unless-stopped
    command: ["python", "consumer_db.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: flightradar
      PG_USER: postgres
      PG_PASSWORD: postgres
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  ws-server:
    build: .
    container_name: flight-ws-server
    restart: unless-stopped
    command: ["python", "ws_server.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8765:8765"
    depends_on:
      - kafka

  frontend:
    build: ./frontend
    container_name: flight-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - ws-server

volumes:
  pg_data:
