apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: flight-radar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: flight-radar:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8765
        envFrom:
        - configMapRef:
            name: flight-radar-config
        env:
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flight-radar-secret
              key: PG_PASSWORD
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: flight-radar
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8765
    targetPort: 8765
