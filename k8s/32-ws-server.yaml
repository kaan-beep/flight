apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: flight
spec:
  replicas: 1
  selector:
    matchLabels: { app: ws-server }
  template:
    metadata:
      labels: { app: ws-server }
    spec:
      containers:
        - name: ws-server
          image: flight-ws-server:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "ws_server.py"]
          ports:
            - containerPort: 8765
          env:
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka.flight.svc.cluster.local:29092" }
---
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: flight
spec:
  selector: { app: ws-server }
  type: NodePort
  ports:
    - { port: 8765, targetPort: 8765, nodePort: 30765 }
