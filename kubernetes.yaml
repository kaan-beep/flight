---
# Flight Radar Kubernetes Deployment
# Registry: your-registry.azurecr.io
# Commands:
#   docker build -t your-registry/flight-producer:latest -f Dockerfile.producer .
#   docker build -t your-registry/flight-consumer:latest -f Dockerfile.consumer .
#   docker push your-registry/flight-producer:latest
#   docker push your-registry/flight-consumer:latest
#   kubectl apply -f kubernetes.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: flight-radar

---
# ConfigMap - Kafka & App Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-config
  namespace: flight-radar
data:
  KAFKA_BROKER: "kafka:9092"
  KAFKA_TOPIC: "flights"
  PG_HOST: "postgres"
  PG_PORT: "5432"
  PG_DB: "flightradar"
  PG_USER: "postgres"
  KAFKA_LOG_RETENTION_HOURS: "720"
  KAFKA_LOG_RETENTION_BYTES: "-1"

---
# Secret - PostgreSQL Password (Change this!)
apiVersion: v1
kind: Secret
metadata:
  name: flight-secrets
  namespace: flight-radar
type: Opaque
stringData:
  PG_PASSWORD: "postgres"
  OPENSKY_USERNAME: "your-opensky-username"
  OPENSKY_PASSWORD: "your-opensky-password"

---
# PersistentVolume - PostgreSQL Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-pv
  namespace: flight-radar
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/pg"

---
# PersistentVolume - Kafka Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv
  namespace: flight-radar
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/kafka"

---
# PersistentVolume - Zookeeper Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zk-pv
  namespace: flight-radar
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/zookeeper"

---
# PersistentVolumeClaim - PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-pvc
  namespace: flight-radar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PersistentVolumeClaim - Kafka
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: flight-radar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# PersistentVolumeClaim - Zookeeper
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zk-pvc
  namespace: flight-radar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Service - PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flight-radar
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

---
# Deployment - PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: flight-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: flight-config
              key: PG_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: flight-config
              key: PG_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flight-secrets
              key: PG_PASSWORD
        volumeMounts:
        - name: pg-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "50m"
      volumes:
      - name: pg-storage
        persistentVolumeClaim:
          claimName: pg-pvc

---
# Service - Zookeeper
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: flight-radar
spec:
  ports:
    - port: 2181
      targetPort: 2181
  selector:
    app: zookeeper

---
# Deployment - Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: flight-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        volumeMounts:
        - name: zk-storage
          mountPath: /var/lib/zookeeper/data
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: zk-storage
        persistentVolumeClaim:
          claimName: zk-pvc

---
# Service - Kafka
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: flight-radar
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka

---
# Deployment - Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: flight-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_LOG_RETENTION_HOURS
          valueFrom:
            configMapKeyRef:
              name: flight-config
              key: KAFKA_LOG_RETENTION_HOURS
        - name: KAFKA_LOG_RETENTION_BYTES
          valueFrom:
            configMapKeyRef:
              name: flight-config
              key: KAFKA_LOG_RETENTION_BYTES
        - name: KAFKA_NUM_NETWORK_THREADS
          value: "8"
        - name: KAFKA_NUM_IO_THREADS
          value: "8"
        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data
        livenessProbe:
          exec:
            command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          exec:
            command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
          requests:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: kafka-storage
        persistentVolumeClaim:
          claimName: kafka-pvc

---
# Deployment - Producer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: flight-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: flight-producer:local
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: flight-config
        - secretRef:
            name: flight-secrets
        livenessProbe:
          exec:
            command: ["python", "-c", "import socket; socket.create_connection(('kafka', 9092), timeout=5)"]
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["python", "-c", "import socket; socket.create_connection(('kafka', 9092), timeout=5)"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "50m"

---
# Deployment - Consumer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: flight-radar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: flight-consumer:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8765
          name: websocket
        envFrom:
        - configMapRef:
            name: flight-config
        livenessProbe:
          exec:
            command: ["python", "-c", "import socket; socket.create_connection(('localhost', 8765), timeout=5)"]
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["python", "-c", "import socket; socket.create_connection(('localhost', 8765), timeout=5)"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "50m"

---
# Service - Consumer (WebSocket)
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: flight-radar
spec:
  type: NodePort
  ports:
    - port: 8765
      targetPort: 8765
      nodePort: 30765
  selector:
    app: consumer
